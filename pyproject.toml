[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yosukiyahw-chunkshare"
version = "0.1.0"
description = "比对同一文档各分片里的元数据与摘要，找出互相矛盾的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "yosukiyahw" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://yosukiyahw.github.io"
Repository = "https://github.com/yosukiyahw/chunkshare"
Issues = "https://github.com/yosukiyahw/chunkshare/issues"

[project.scripts]
chunkshare = "chunkshare:main"

[tool.setuptools]
py-modules = ["chunkshare"]
